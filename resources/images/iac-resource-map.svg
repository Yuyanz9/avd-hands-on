<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1660" viewBox="0 0 1800 1660" role="img" aria-labelledby="title desc">
  <title id="title">AVD ハンズオン IaC リソース構成図</title>
  <desc id="desc">現行 production の Network、AVD、追加セッションホストの各テンプレートが作る Azure リソース、手動で選択する入力、IaC 対象外の項目を示す図。</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Yu Gothic UI", "Meiryo", sans-serif; fill: #172b4d; }
      .title { font-size: 38px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #52647a; }
      .section { font-size: 24px; font-weight: 700; }
      .heading { font-size: 20px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #52647a; }
      .tiny { font-size: 14px; fill: #52647a; }
      .code { font-family: Consolas, "Yu Gothic UI", monospace; font-size: 15px; fill: #172b4d; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .blue-card { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
      .green-card { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; }
      .orange-card { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; }
      .gray-card { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; }
      .line { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .ref-line { stroke: #64748b; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowSlate); }
    </style>
  </defs>

  <rect width="1800" height="1660" fill="#f3f6fb"/>

  <text x="60" y="62" class="title">IaC で作成する予定のリソース</text>
  <text x="60" y="101" class="subtitle">AVD ハンズオン production ／ Network → AVD →（任意）セッションホスト追加</text>
  <rect x="1450" y="36" width="290" height="42" rx="21" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="1595" y="63" text-anchor="middle" class="small" style="font-weight:700;fill:#9a3412">入力追加版 ／ 公開済み</text>

  <rect x="60" y="125" width="1680" height="98" rx="16" class="orange-card"/>
  <text x="86" y="161" class="heading" style="fill:#9a3412">Azure Portal で選ぶ共通項目</text>
  <text x="86" y="194" class="body">サブスクリプション ＋ デプロイ先の既存リソースグループ（RG）</text>
  <line x1="804" y1="146" x2="804" y2="204" stroke="#fdba74" stroke-width="2"/>
  <text x="835" y="161" class="body" style="font-weight:700">Network と AVD は通常同じ RG</text>
  <text x="835" y="194" class="small">AVD は既存 VNet の RG を別途指定可能（同じサブスクリプション内）</text>
  <text x="1486" y="161" class="small" style="font-weight:700">RG 自体は手動作成</text>
  <text x="1486" y="194" class="small">既存の演習用 RG を選択</text>

  <g>
    <rect x="60" y="242" width="370" height="54" rx="13" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="245" y="276" text-anchor="middle" class="body" style="font-weight:700">1　Network（2方式から選択）</text>
    <line x1="440" y1="269" x2="490" y2="269" class="line"/>
    <rect x="505" y="242" width="375" height="54" rx="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="692" y="276" text-anchor="middle" class="body" style="font-weight:700">Windows 365 は別担当・別手順</text>
    <line x1="890" y1="269" x2="940" y2="269" class="line"/>
    <rect x="955" y="242" width="340" height="54" rx="13" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="1125" y="276" text-anchor="middle" class="body" style="font-weight:700">2　AVD を作成</text>
    <line x1="1305" y1="269" x2="1355" y2="269" class="ref-line"/>
    <rect x="1370" y="242" width="370" height="54" rx="13" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
    <text x="1555" y="276" text-anchor="middle" class="body" style="font-weight:700">3　必要ならホストを追加</text>
  </g>

  <rect x="55" y="320" width="745" height="600" rx="18" class="card"/>
  <rect x="55" y="320" width="745" height="58" rx="18" fill="#dbeafe"/>
  <path d="M55 360 v18 h745 v-18" fill="#dbeafe"/>
  <text x="82" y="358" class="section">1　Network：3サブネット＋送信方式の選択</text>
  <text x="82" y="410" class="heading">Virtual Network：vnet-vdi</text>
  <text x="82" y="438" class="code">10.10.0.0/16　｜　Japan East</text>

  <rect x="78" y="460" width="215" height="232" rx="13" class="blue-card"/>
  <text x="94" y="493" class="heading">snet-cloudpc</text>
  <text x="94" y="526" class="code">10.10.1.0/24</text>
  <text x="94" y="570" class="body">Cloud PC / ANC 用</text>
  <text x="94" y="607" class="small">サブネットだけ作成</text>
  <text x="94" y="635" class="small">Cloud PC は作らない</text>

  <rect x="310" y="460" width="215" height="232" rx="13" class="green-card"/>
  <text x="326" y="493" class="heading">snet-avd</text>
  <text x="326" y="526" class="code">10.10.2.0/24</text>
  <text x="326" y="570" class="body">AVD セッション</text>
  <text x="326" y="599" class="body">ホスト用</text>
  <text x="326" y="646" class="small">初回／追加 VM が使用</text>

  <rect x="542" y="460" width="235" height="232" rx="13" class="blue-card"/>
  <text x="558" y="493" class="heading">snet-server</text>
  <text x="558" y="526" class="code">10.10.3.0/24</text>
  <text x="558" y="570" class="body">Server 用（予備）</text>
  <text x="558" y="607" class="small">サブネットだけ作成</text>
  <text x="558" y="635" class="small">接続先 VM は別 VNet</text>

  <rect x="78" y="715" width="337" height="166" rx="13" class="blue-card"/>
  <text x="96" y="748" class="heading">Network（通常）</text>
  <text x="96" y="780" class="small">nat-vdi ＋ pip-vdi を作成</text>
  <text x="96" y="808" class="small">NAT を3サブネットに関連付け</text>
  <text x="96" y="836" class="small">defaultOutboundAccess: false</text>
  <text x="96" y="864" class="small">NSG は作成しない</text>
  <rect x="427" y="715" width="350" height="166" rx="13" class="orange-card"/>
  <text x="445" y="748" class="heading" style="fill:#9a3412">Network-Validation（任意）</text>
  <text x="445" y="780" class="small">NAT Gateway／Public IP なし</text>
  <text x="445" y="808" class="small">defaultOutboundAccess: true</text>
  <text x="445" y="836" class="small">NSG は作成しない</text>
  <text x="445" y="864" class="small" style="font-weight:700;fill:#9a3412">別テンプレート。どちらか一方を選ぶ</text>

  <rect x="830" y="320" width="915" height="600" rx="18" class="card"/>
  <rect x="830" y="320" width="915" height="58" rx="18" fill="#dbeafe"/>
  <path d="M830 360 v18 h915 v-18" fill="#dbeafe"/>
  <text x="857" y="358" class="section">2　AVD テンプレート</text>

  <path d="M418 460 V451 H817 V575 H854" class="ref-line"/>
  <text x="660" y="445" text-anchor="middle" class="tiny">既存 subnet</text>

  <rect x="857" y="400" width="250" height="88" rx="12" class="blue-card"/>
  <text x="982" y="435" text-anchor="middle" class="heading">Host Pool</text>
  <text x="982" y="465" text-anchor="middle" class="code">DefaultHostPool</text>
  <rect x="1120" y="400" width="260" height="88" rx="12" class="blue-card"/>
  <text x="1250" y="435" text-anchor="middle" class="heading">Desktop App Group</text>
  <text x="1250" y="465" text-anchor="middle" class="code">DefaultHostPool-DAG</text>
  <rect x="1393" y="400" width="325" height="88" rx="12" class="blue-card"/>
  <text x="1555" y="435" text-anchor="middle" class="heading">Workspace</text>
  <text x="1555" y="465" text-anchor="middle" class="code">AVD Session Host</text>
  <line x1="1108" y1="444" x2="1117" y2="444" class="line"/>
  <line x1="1381" y1="444" x2="1390" y2="444" class="line"/>

  <rect x="857" y="510" width="861" height="137" rx="14" class="green-card"/>
  <text x="880" y="545" class="heading">初回セッションホスト VM ＋ NIC ＋ OS ディスク</text>
  <text x="880" y="579" class="body">既定1台（1～10台）｜ Windows 11 25H2 AVD（Microsoft 365 Apps 入り）</text>
  <text x="880" y="610" class="code">Standard_D4as_v6　｜　128 GiB StandardSSD_LRS　｜　Public IP なし</text>
  <text x="880" y="635" class="small">VM 名：JST の日時プレフィックス＋「-0」～「-9」｜ 既存 VNet の RG を指定可能</text>

  <rect x="857" y="666" width="270" height="98" rx="11" class="card"/>
  <text x="992" y="697" text-anchor="middle" class="heading">Entra ID 参加</text>
  <text x="992" y="729" text-anchor="middle" class="small">AADLoginForWindows 拡張</text>
  <rect x="1142" y="666" width="270" height="98" rx="11" class="card"/>
  <text x="1277" y="697" text-anchor="middle" class="heading">AVD 登録</text>
  <text x="1277" y="729" text-anchor="middle" class="small">DSC 拡張＋短期登録トークン</text>
  <rect x="1427" y="666" width="291" height="98" rx="11" class="card"/>
  <text x="1572" y="697" text-anchor="middle" class="heading">構成スクリプト</text>
  <text x="1572" y="729" text-anchor="middle" class="small">GitHub 固定版／空欄なら省略</text>

  <rect x="857" y="782" width="408" height="98" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="878" y="815" class="heading">接続権限：実行ユーザー</text>
  <text x="878" y="846" class="small">DAG: Desktop Virtualization User</text>
  <text x="878" y="868" class="small">VM: Virtual Machine User Login</text>
  <rect x="1280" y="782" width="438" height="98" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1301" y="815" class="heading">その他の自動設定</text>
  <text x="1301" y="846" class="small">SSO プロパティ　｜　毎日 22:00（日本時間）に VM 停止</text>
  <text x="1301" y="868" class="small">Windows Cloud Login などテナント設定は別途手動</text>

  <rect x="55" y="948" width="820" height="285" rx="18" class="card"/>
  <rect x="55" y="948" width="820" height="58" rx="18" fill="#dcfce7"/>
  <path d="M55 988 v18 h820 v-18" fill="#dcfce7"/>
  <text x="82" y="986" class="section">3　追加セッションホスト（任意）</text>
  <text x="82" y="1043" class="body" style="font-weight:700">既存 Host Pool と既存 subnet を使い、既定1台（1～10台）追加</text>
  <text x="82" y="1080" class="body">作成：VM／NIC／OS ディスク／VM Login 権限</text>
  <text x="82" y="1115" class="body">設定：Entra ID 参加／AVD 登録／任意の日本語設定拡張</text>
  <text x="82" y="1150" class="body">追加 VM にも毎日22:00（日本時間）の自動停止を設定</text>
  <text x="82" y="1193" class="small">既存 Host Pool・Workspace・VNet は作り直さない。登録トークンで既存プールへ接続</text>

  <rect x="900" y="948" width="845" height="285" rx="18" class="gray-card"/>
  <text x="928" y="986" class="section">IaC の対象外（別途・手動）</text>
  <text x="928" y="1035" class="body">• Windows 365 Cloud PC と ANC（snet-cloudpc のみ作成）</text>
  <text x="928" y="1073" class="body">• Day 2 の接続先 VM／別 VNet（VNet 作成方式は要決定）</text>
  <text x="928" y="1111" class="body">• Entra 動的デバイスグループ／Windows Cloud Login 設定</text>
  <text x="928" y="1149" class="body">• リソースグループ作成、NSG・ファイアウォールの通信制御</text>
  <text x="928" y="1197" class="small">手動作成の Entra グループは、ここに描いた Azure リソースには含まれません</text>

  <text x="60" y="1280" class="section">デプロイ時に選べる／変更できる項目</text>
  <text x="60" y="1310" class="small">橙色は選択・入力事項です。Network は通常版／検証用の別テンプレートを選びます。AVD と追加ホストは既定値を変更できます。</text>

  <rect x="55" y="1330" width="535" height="270" rx="16" class="orange-card"/>
  <text x="80" y="1372" class="heading" style="fill:#9a3412">Network</text>
  <text x="80" y="1412" class="small">• Portal：サブスクリプション／既存 RG</text>
  <text x="80" y="1448" class="small">• 選択：Network（NATあり）または</text>
  <text x="100" y="1478" class="small">Network-Validation（NATなし）</text>
  <text x="80" y="1515" class="small">• 変更可：リージョン、VNet 名、CIDR 4種、</text>
  <text x="100" y="1545" class="small">NAT／Public IP 名（通常版のみ）</text>
  <text x="80" y="1578" class="tiny">RG は先に手動作成。別 RG なら AVD 側に VNet の RG を指定</text>

  <rect x="610" y="1330" width="535" height="270" rx="16" class="orange-card"/>
  <text x="635" y="1372" class="heading" style="fill:#9a3412">AVD（初回作成）</text>
  <text x="635" y="1412" class="body">• 必須：VM 管理者パスワード（Secure）</text>
  <text x="635" y="1448" class="small">• 変更可：VNet RG／VNet／サブネット／リージョン</text>
  <text x="635" y="1480" class="small">  イメージ SKU（既定 M365）／Workspace 名／VM サイズ</text>
  <text x="635" y="1512" class="small">  ディスク種別／最大セッション数／VM 名プレフィックス</text>
  <text x="635" y="1544" class="small">  スクリプト URL（空欄で省略）／台数（1～10）</text>
  <text x="635" y="1576" class="small">  Hostpool Type／Load Balancer Type（Pooled／BreadthFirst）</text>

  <rect x="1165" y="1330" width="580" height="270" rx="16" class="orange-card"/>
  <text x="1190" y="1372" class="heading" style="fill:#9a3412">セッションホスト追加</text>
  <text x="1190" y="1412" class="body">• 必須：VM 管理者パスワード＋登録トークン</text>
  <text x="1190" y="1448" class="small">• 選択可：既存 Host Pool、VNet の RG／名前／サブネット</text>
  <text x="1190" y="1480" class="small">  リージョン／イメージ SKU／VM サイズ／ディスク種別</text>
  <text x="1190" y="1512" class="small">  VM 名プレフィックス／スクリプト URL（空欄で省略）</text>
  <text x="1190" y="1557" class="small">追加台数：既定1台（1～10台）。既存プールの設定は変更しない</text>

  <text x="60" y="1632" class="tiny">※ 図の入力追加版と RDP 2項目の修正は公開済みです。Azure への実デプロイと接続は未確認です。</text>
</svg>
